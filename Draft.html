.breathe-ov .circle.expand{transform:scale(1.3);opacity:.6}
.breathe-ov .circle.contract{transform:scale(.8);opacity:.15}
.bring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.bring .ring-bg{fill:none;stroke:rgba(255,255,255,.13);stroke-width:7}
.bring .ring-fg{fill:none;stroke:var(--pri);stroke-width:7;stroke-linecap:round;stroke-dasharray:628.3;stroke-dashoffset:628.3}
.bpause{position:absolute;z-index:2;width:76px;height:76px;min-height:76px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}
.bpause:active{transform:scale(.94)}
.breathe-ov .blabel{font-size:23px;font-weight:800;letter-spacing:.04em;animation:bl .5s ease;min-width:120px;text-align:center}
.breathe-ov .blabel.dim{opacity:.6}
@keyframes bl{from{transform:translateY(6px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.bdots{display:flex;gap:12px;justify-content:center;margin-top:-6px}
.bdot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .45s ease}
.bdot.on{background:var(--pri);transform:scale(1.35);box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 28%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--pri) 12%,transparent)}}
.bcyc{font-size:13px;font-weight:700;color:#9AA2B1;letter-spacing:.04em}
.brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.breathe-ov .bstop{padding:12px 22px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.18)}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button,input,select,textarea{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px}

.sheet>div{max-height:88dvh;-webkit-overflow-scrolling:touch}
.steps,.contentbox,.breathe-ov .bsub{-webkit-overflow-scrolling:touch}
.run{padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

.sechd .chev{display:grid;place-items:center;color:var(--mut);transition:transform .2s ease}

/* ============ LIGHTHOUSE ADDITIONS ============ */
/* Beam overlay */
.lh-beam{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.lh-beam::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;

.dotmenu{width:42px;height:42px;min-height:42px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);flex:none}

.proj .artifact b{color:var(--spark)}
.proj .deadlinePill{position:absolute;top:14px;inset-inline-end:14px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--anchor) 15%,transparent);color:var(--anchor);border:1px solid color-mix(in srgb,var(--anchor) 35%,transparent)}

.estChips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}

.customEst{display:flex;gap:6px;align-items:center;margin-top:4px}

.fuel{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--spark) 12%,transparent);color:var(--spark);font-weight:800;font-size:12px}

/* Add delay reminder badge */
.bell{color:var(--spark);vertical-align:-2px}

/* nav 5 items tighter */
nav button{font-size:10px;padding:0 2px}

/* ============ HORIZON FILTER ============ */
function matchesHorizon(t){
  const h=S.filter.horizon||'today';
  if(t.noise)return false;
  if(h==='today')return t.d===day(S.vd);
  if(h==='tomorrow')return t.d===day(1);
  if(h==='week'){const start=day(-wd(day(0))),end=day(-wd(day(0))+6);return t.d>=start&&t.d<=end}
  if(h==='next7'){const o=off(t.d);return o>=0&&o<7}
  if(h==='inbox')return (t.list||'inbox')==='inbox';
  return t.d===day(S.vd);
}
function horizonTasks(){
  let tasks=S.tasks.filter(t=>!t.par&&!t.fl&&!t.wont&&!t.noise&&matchesHorizon(t));
  if(S.filter.sec)tasks=tasks.filter(t=>t.sec===S.filter.sec);
  if(S.filter.tag)tasks=tasks.filter(t=>(t.tags||[]).includes(S.filter.tag));
  if(S.lf!=='all')tasks=tasks.filter(t=>(t.list||'inbox')===S.lf);
  return tasks;
}

function vProjects(){

    const total=p.hf.reduce((a,x)=>a+x.dur,0);

    const pct=total?doneHf/total*100:0;

    return `<div class="proj">

function impTagPri(tags){for(const t0 of (tags||[])){const s=String(t0).toLowerCase();if(/red/.test(s))return 'r';if(/orange/.test(s))return 'o';if(/blue/.test(s))return 'b'}return ''}
function impDone(v){if(v==null||v==='')return 0;if(v===true||v===2)return 1;const t=String(v).toLowerCase().trim();if(t==='0'||t==='false'||t==='in progress'||t==='open'||t==='not started'||t==='undone')return 0;return /done|complete|finished|yes|true|^2$/.test(t)?1:0}
function impDate(s){if(s==null||s==='')return null;if(typeof s==='number'||/^\d{10,13}$/.test(String(s).trim())){const n=+s,d=new Date(n>1e11?n:n*1000);if(!isNaN(d))return dk(d)}const t=String(s).trim();let m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');m=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){const d=new Date(+m[3],+m[2]-1,+m[1]);if(!isNaN(d))return dk(d)}const d2=new Date(t);if(!isNaN(d2))return dk(d2);return null}
function impTime(s){const m=String(s==null?'':s).match(/(\d{1,2}):(\d{2})/);return m?pad(+m[1])+':'+m[2]:''}
function parseCSV(text){text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}}if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function impFromRows(rows){if(!rows.length)return {items:[],skip:0};const find=(hdr,keys)=>{for(let i=0;i<hdr.length;i++){const h=String(hdr[i]).toLowerCase().trim();if(keys.some(k=>h===k||h.includes(k)))return i}return -1};const h0=rows[0].map(x=>String(x).toLowerCase());const hasHdr=find(h0,['title','task name','task','name'])>=0;let ci,body=rows;if(hasHdr){body=rows.slice(1);ci={t:find(h0,['title','task name','name','task']),st:find(h0,['status','complet']),sd:find(h0,['start date','start']),dd:find(h0,['due date','due','deadline']),pr:find(h0,['priority']),li:find(h0,['list','folder']),cn:find(h0,['content','note','description']),tg:find(h0,['tag'])}}else ci={t:0,st:-1,sd:1,dd:2,pr:3,li:4,cn:-1,tg:-1};const seen=new Set(S.tasks.map(t=>String(t.t).trim().toLowerCase()+'|'+t.d+'|'+((t.list&&t.list!=='inbox')?String(lname(t.list)).trim().toLowerCase():''))),items=[];let skip=0;for(const r of body){const g=i=>i>=0&&i<r.length?r[i]:'';const title=String(g(ci.t)).trim();if(!title||/^(list|title|task)$/i.test(title))continue;const dd=g(ci.dd),sd=g(ci.sd);const d=impDate(dd)||impDate(sd)||day(0);const listn=String(g(ci.li)||'').trim();const key=title.toLowerCase()+'|'+d+'|'+listn.toLowerCase();if(seen.has(key)){skip++;continue}seen.add(key);const tags=String(g(ci.tg)||'').split(/[;,\u060c]/).map(x=>x.trim()).filter(Boolean);const cn=String(g(ci.cn)||'').slice(0,5000);items.push({t:title,d,tm:impTime(dd)||impTime(sd),pri:impPri(g(ci.pr))||impTagPri(tags),done:impDone(g(ci.st)),list:listn,c:cn,tags})}return {items,skip}}
function impFromJSON(data){const arr=Array.isArray(data)?data:(data&&Array.isArray(data.tasks)?data.tasks:(data&&Array.isArray(data.data)?data.data:null));if(!arr)throw 0;const seen=new Set(S.tasks.map(t=>String(t.t).trim().toLowerCase()+'|'+t.d+'|'+((t.list&&t.list!=='inbox')?String(lname(t.list)).trim().toLowerCase():''))),items=[];let skip=0;for(const o of arr){if(!o||typeof o!=='object')continue;if(o.status===3)continue;const title=String(o.title||o.Title||o.name||o.summary||'').trim();if(!title)continue;const d=impDate(o.dueDate!=null?o.dueDate:(o.due_date!=null?o.due_date:(o.due!=null?o.due:(o.startDate!=null?o.startDate:(o.start_date!=null?o.start_date:o.start)))))||day(0);const li2=String(o.listName||o.list||o.folder||'').replace(/^[0-9a-f]{16,}$/i,'').trim();const tg2=Array.isArray(o.tags)?o.tags.map(String):[];const key=title.toLowerCase()+'|'+d+'|'+li2.toLowerCase();if(seen.has(key)){skip++;continue}seen.add(key);const done=(o.status===2||o.isCompleted===true||o.completed===true||(o.status!=null&&/done|complete/i.test(String(o.status))))?1:0;const tm=(o.allDay||o.isAllDay)?'':impTime(o.dueDate!=null?o.dueDate:(o.startDate!=null?o.startDate:''));items.push({t:title,d,tm,pri:impPri(o.priority!=null?o.priority:o.pri)||impTagPri(tg2),done,list:li2,c:String(o.content||o.note||o.description||'').slice(0,5000),tags:tg2})}return {items,skip}}
function impParse(text){text=String(text||'').trim();if(!text)return {err:1};let res;try{if(text[0]==='['||text[0]==='{'){res=impFromJSON(JSON.parse(text))}else{const rows=parseCSV(text);if(!rows.length)throw 0;const lookHdr=rows[0].some(c=>/title|task name|^name$|due date|start date|priority|status/i.test(String(c)));const lookTab=rows[0].length>1||rows.length>1||/\d/.test(rows[0].join(''));if(!lookHdr&&!lookTab)throw 0;res=impFromRows(rows)}}catch(e){return {err:1}}if(!res||(!res.items||!res.items.length)&&!(res.skip))return res&&res.items?res:{err:1};return res}
function impFile(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{S.imp=impParse(rd.result);S.impRaw='';r()};rd.onerror=()=>{S.imp={err:1};r()};rd.readAsText(f)}
